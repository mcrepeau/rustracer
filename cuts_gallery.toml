# Cuts gallery: every [[gems]] cut preset x material preset in a 6x2 grid,
# staged like the single-stone scenes (dark floor, studio light-tent env map,
# caustics on). The photon disk hugs the grid automatically (infinite floor
# is excluded from the emission bounds), so each stone gets its own caustic
# pool.
#
# View:    cargo run --release -- --scene cuts_gallery.toml
# Render:  cargo run --release -- --render --scene cuts_gallery.toml --preset final --width 1280 --height 720 --output gallery.png
#
# Row 0 (back,  z = -0.012): round brilliant, oval brilliant, princess,
#                            emerald (step), cushion, asscher
# Row 1 (front, z = +0.012): radiant, baguette, trillion, marquise, pear,
#                            round brilliant emerald
# Grid pitch 0.024 (24 mm); all girdle centres at y = 0.020.
name = "cuts gallery — all gem presets"
max_samples = 1024

[camera]
look_from  = [0.055, 0.100, -0.132]
look_at    = [0.0, 0.018, 0.0]
vfov       = 30.0
aperture   = 0.0
focus_dist = 0.164
move_speed = 0.0059

[background]
type = "env_map"
path = "assets/studio_softbox.hdr"

[[objects]]
shape    = { type = "infinite_plane", point = [0, 0, 0], normal = [0, 1, 0] }
material = { type = "pbr", albedo = [0.04, 0.04, 0.05], roughness = 0.25, metallic = 0.0 }


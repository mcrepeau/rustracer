# Scene for the stone graded in LG625469749.pdf (IGI, March 9, 2024):
# laboratory-grown (CVD, Type IIa) OVAL BRILLIANT, 1.50 ct, color E, VVS2,
# 8.99 x 6.42 x 3.97 mm, table 58%, crown 16% / pavilion 41% of minor axis,
# depth 61.8%, girdle medium-to-slightly-thick pointed, polish/symmetry Excellent.
#
# Staging: the stone floats ~15 mm above the floor (invisible mount, as in a
# jewelry display). All light comes from the studio env map below (a light
# tent); caustics are emitted from the map's brightest direction.
name = "LG625469749 oval diamond"
max_samples = 1024

[camera]
look_from  = [0.012, 0.025, -0.024]   # ~0.028 from the stone (was 0.084)
look_at    = [0.0, 0.017, 0.0]
vfov       = 30.0
aperture   = 0.0
focus_dist = 0.028
move_speed = 0.001   # close-up framing: finer steps per keypress

[background]
type = "env_map"
path = "assets/studio_softbox.hdr"

[[objects]]
shape    = { type = "infinite_plane", point = [0, 0, 0], normal = [0, 1, 0] }
material = { type = "pbr", albedo = [0.04, 0.04, 0.05], roughness = 0.25, metallic = 0.0 }

[[gems]]
report          = "LG625469749 (IGI 2024-03-09, lab-grown CVD Type IIa)"
carat           = 1.50
measurements_mm = [8.99, 6.42, 3.97]   # L x W x depth, mm -> oval ratio 1.40
table_pct       = 58.0
crown_pct       = 16.0                 # % of minor axis -> ~37.3 deg
pavilion_pct    = 41.0                 # % of minor axis -> ~39.3 deg
depth_pct       = 61.8
color_grade     = "E"
center          = [0.0, 0.0176, 0.0]   # girdle centre: pavilion (2.63 mm) + 15 mm air gap
scale_mm        = 0.001                # mm -> metres

[caustics]
enabled       = true
gather_radius = 0.008
num_photons   = 300000

# --- Animation: 360-degree orbit around the stone ([animation.orbit] mechanics) ---
# Headless render writes one PNG per frame into the output dir:
#   cargo run --release --features denoise -- --render --scene gem_LG625469749.toml --preset final --width 480 --height 300 --output frames
# then assemble with the ffmpeg command printed after the last frame.
[animation]
fps      = 24
duration = 4.0   # 96 frames

[animation.orbit]
center      = [0.0, 0.0, 0.0]    # orbit axis (XZ only; Y comes from `height`)
radius      = 0.028              # ~ default camera distance to the stone
height      = 0.025              # camera Y during the orbit
look_at     = [0.0, 0.017, 0.0]  # the stone
start_angle = 180.0              # start on the default camera side (-Z)
end_angle   = 360.0              # full orbit
vfov        = 30.0
focus_dist  = 0.028

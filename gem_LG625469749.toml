# Scene for the stone graded in LG625469749.pdf (IGI, March 9, 2024):
# laboratory-grown (CVD, Type IIa) OVAL BRILLIANT, 1.50 ct, color E, VVS2,
# 8.99 x 6.42 x 3.97 mm, table 58%, crown 16% / pavilion 41% of minor axis,
# depth 61.8%, girdle medium-to-slightly-thick pointed, polish/symmetry Excellent.
#
# Staging: the stone floats ~15 mm above the floor (invisible mount, as in a
# jewelry display). All light comes from the studio env map below (a light
# tent); caustics are emitted from the map's brightest direction.
name = "LG625469749 oval diamond"
max_samples = 1024

[camera]
look_from  = [0.035, 0.032, -0.075]
look_at    = [0.0, 0.017, 0.0]
vfov       = 30.0
aperture   = 0.0
focus_dist = 0.085
move_speed = 0.002   # scene is mm-scale (~0.1 units wide); 0.2 would cross it in one keypress

# Procedural "light tent" env map: near-uniform bright background (even light
# from all sides) plus very soft glows at the softbox positions - regenerate
# with `py make_studio_softbox.py`. All lighting - and the caustic photon
# source - comes from this map; no [[lights]] needed.
[background]
type = "env_map"
path = "assets/studio_softbox.hdr"
# alternatives:
# type  = "solid"
# color = [0.002, 0.002, 0.005]              # original near-black
# type  = "env_map"
# path  = "assets/sunset_puresky_4k.hdr"     # same sky as scene.toml
# Preetham sky + physical sun disc (like the random-spheres scene) - dimmer on
# the stone (sun energy sits in a 0.23 deg disc), kept for backlit shots:
# type = "physical"
# sun_azimuth = 0.0        # deg clockwise from +Z; 0 = behind the stone vs default camera
# sun_elevation = 12.0     # deg above the horizon
# turbidity = 3.0

[[objects]]
shape    = { type = "infinite_plane", point = [0, 0, 0], normal = [0, 1, 0] }
material = { type = "pbr", albedo = [0.04, 0.04, 0.05], roughness = 0.25, metallic = 0.0 }

[[gems]]
report          = "LG625469749 (IGI 2024-03-09, lab-grown CVD Type IIa)"
carat           = 1.50
measurements_mm = [8.99, 6.42, 3.97]   # L x W x depth, mm -> oval ratio 1.40
table_pct       = 58.0
crown_pct       = 16.0                 # % of minor axis -> ~37.3 deg
pavilion_pct    = 41.0                 # % of minor axis -> ~39.3 deg
depth_pct       = 61.8
color_grade     = "E"
center          = [0.0, 0.0176, 0.0]   # girdle centre: pavilion (2.63 mm) + 15 mm air gap
scale_mm        = 0.001                # mm -> metres

[caustics]
enabled       = true
gather_radius = 0.008
num_photons   = 300000

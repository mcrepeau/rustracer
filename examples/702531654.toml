# Scene generated by report_to_toml.py from 702531654.pdf
# IGI report LG702531654 (April 25, 2025): LABORATORY GROWN DIAMOND, ROUND BRILLIANT,
# 0.23 ct, color D, clarity VS1, 3.875 x 3.875 x 2.42 mm
# table 61%, crown 13% / pavilion 44.5%, depth 62.6%, culet Pointed, girdle Slightly Thick  To Thick
#
# Staging: stone rests on the floor (culet tip + 0 mm gap); lightbox studio HDR env map lights the scene; pbr disk floor (Blue Nile style);
# Lighting: assets/studio_small_09_8k.hdr only;
# caustics on. Interactive view:  cargo run --release -- --scene scenes/702531654.toml
# Render still:     --render --preset final --width 480 --height 300 --output out.png
# Render turntable: --render --preset final --width 1280 --height 720 --output frames
#                   (the [animation.orbit] block at the bottom frames the stone automatically)
# Gem-spin still series:  py spin_stills.py <this file>   (one crisp still per --spin <deg>, no blur)

name = "LG702531654 ROUND BRILLIANT"

[camera]
look_from  = [2.8954, 2.6636, -4.9337]
look_at    = [0.3114, 0.4675, -0.3957]
vfov       = 20.0
aperture   = 0.000
focus_dist = 5.6651
move_speed = 0.20232

[background]
type = "env_map"
path = "assets/studio_small_09_8k.hdr"
visible = { type = "gradient", top = [1.0, 1.0, 1.0], bottom = [0.8, 0.8, 0.8] }  # white seamless sweep; env map still lights

[[objects]]
shape    = { type = "disk", center = [0, 0, 0], normal = [0, 1, 0], radius = 30 }
material = { type = "pbr", albedo = [0.9, 0.9, 0.9], roughness = 0.5, metallic = 0.0 }


[[gems]]
report          = "LG702531654 (IGI April 25, 2025, LABORATORY GROWN DIAMOND)"
carat           = 0.23
measurements_mm = [3.875, 3.875, 2.42]   # L x W x depth, mm
table_pct       = 61
crown_pct       = 13                 # % of minor axis
pavilion_pct    = 44.5
depth_pct       = 62.6
girdle_pct       = 4.5                 # girdle band, % of diameter (report: Slightly Thick  To Thick)
girdle_finish     = "faceted"              # girdle condition from the report (brilliant cuts)
color_grade     = "D"
cut             = "brilliant"
material        = "diamond"
polish          = 0.02                 # per-facet micro-tilt, radians (polish marks; 0 = optical-perfect)
center          = [0.0, 0.4675, 0.0]   # pavilion (1.72 mm) + girdle/2 (0.087 mm) + 0 mm gap above the floor
scale_mm        = 0.258065               # mm -> scene units (stone length = 1)

[caustics]
enabled       = true
gather_radius = 0.35
num_photons   = 500000

# --- Animation: 360-degree orbit matching the still camera (frame 0 = still shot) ---
[animation]
fps      = 24
duration = 4.0   # 96 frames

[animation.orbit]
center      = [0.0, 0.0, 0.0]    # orbit axis (XZ only; Y comes from `height`)
radius      = 5.7206              # horizontal distance of look_from
height      = 2.6636              # look_from y
look_at     = [0.3114, 0.4675, -0.3957]  # same as the still camera
start_angle = 149.59              # orbit angle of look_from
end_angle   = 509.59              # full 360-degree orbit
vfov        = 20.0
focus_dist  = 5.6651

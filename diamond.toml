# Diamond scene — round brilliant suspended in a physical sky, caustics on the ground.
#
# Render (single frame):
#   cargo run --release -- --render --scene diamond.toml --adaptive
#
# Render (animation, 144 frames):
#   cargo run --release -- --render --scene diamond.toml --adaptive --min-samples 64
#
# Assemble video (ffmpeg prints the command after the last frame):
#   ffmpeg -r 24 -i "diamond_%04d.png" -c:v libx264 -pix_fmt yuv420p diamond_orbit.mp4

name        = "Diamond"
max_samples = 2000

# ── Camera ────────────────────────────────────────────────────────────────────
[camera]
look_from  = [0.0, 2.0, 3.5]
look_at    = [0.0, 1.0, 0.0]
vfov       = 40.0
aperture   = 0.0

# ── Background ────────────────────────────────────────────────────────────────
# Sun at 50° elevation, slightly off-axis — shines through the gem at an angle
# and focuses into a caustic pattern below it.  Low turbidity = hard shadows.
[background]
type          = "physical"
sun_azimuth   = -30.0
sun_elevation = 50.0
turbidity     = 2.0

# ── Objects ───────────────────────────────────────────────────────────────────

# Ground — light grey Lambertian disk to catch and display the caustics clearly.
[[objects]]
shape    = { type = "disk", center = [0.0, 0.0, 0.0], normal = [0.0, 1.0, 0.0], radius = 20.0 }
material = { type = "lambertian", color = [0.82, 0.82, 0.82] }

# Diamond — Tolkowsky round brilliant (53 % table, 34.5° crown, 40.75° pavilion).
# SpectralDielectric: ior = 2.417 at the d-line (589 nm), dispersion = 0.044
# maps to Cauchy n(λ) = B + C/λ² matching the measured diamond dispersion curve.
[[objects]]
shape    = { type = "diamond", center = [0.0, 1.5, 0.0], radius = 0.4, table_pct = 53.0, crown_angle = 34.5, pavilion_angle = 40.75 }
material = { type = "spectral_dielectric", ior = 2.417, dispersion = 0.044 }

# ── Caustics ──────────────────────────────────────────────────────────────────
# Photons emitted from the physical sun, traced through the gem, stored where
# they land on diffuse surfaces.  Gather radius tuned for a 0.4-unit gem at
# unit scale — increase if caustic patches look noisy, decrease for sharpness.
[caustics]
enabled       = true
gather_radius = 0.15

# ── Animation — 360° orbit around the diamond ─────────────────────────────────
# 8 keyframes at 45° intervals keep the Catmull-Rom path within ~1% of the
# true circle radius (see scene.toml for explanation of the 4-keyframe artifact).
[animation]
fps      = 24
duration = 6.0   # 144 frames

[[animation.keyframes]]
time      = 0.00
look_from = [ 0.00, 2.0,  3.50]   #   0°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 0.75
look_from = [ 2.47, 2.0,  2.47]   #  45°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 1.50
look_from = [ 3.50, 2.0,  0.00]   #  90°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 2.25
look_from = [ 2.47, 2.0, -2.47]   # 135°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 3.00
look_from = [ 0.00, 2.0, -3.50]   # 180°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 3.75
look_from = [-2.47, 2.0, -2.47]   # 225°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 4.50
look_from = [-3.50, 2.0,  0.00]   # 270°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 5.25
look_from = [-2.47, 2.0,  2.47]   # 315°
look_at   = [0.0, 1.0, 0.0]

[[animation.keyframes]]
time      = 6.00
look_from = [ 0.00, 2.0,  3.50]   # 360° = 0°
look_at   = [0.0, 1.0, 0.0]

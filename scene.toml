# rustracer — custom scene file
# Press [R] in the viewer to hot-reload after editing, or [4] to select this scene.
#
# Coordinate system: Y is up.  Objects are placed in world space.
# Units are arbitrary — keep them consistent within a scene.

name        = "OBJ loading"
max_samples = 2000

# ── Camera ────────────────────────────────────────────────────────────────────
[camera]
look_from  = [2, 4, 12]
look_at    = [0, 3.5, 0]
vfov       = 40.0
aperture   = 0.04
move_speed = 0.3

# ── Background ────────────────────────────────────────────────────────────────
[background]
type          = "physical"
sun_azimuth   = -55.0
sun_elevation = 32.0

# ── Objects ───────────────────────────────────────────────────────────────────
# Shapes:
#   sphere         — center [x,y,z]  radius
#   box            — p_min [x,y,z]   p_max [x,y,z]
#   cylinder       — center [x,y,z]  radius  height
#   cone           — center [x,y,z]  radius  height
#   disk           — center [x,y,z]  normal [x,y,z]  radius
#   infinite_plane — point [x,y,z]   normal [x,y,z]  (wave_amplitude  wave_scale)
#   mesh           — path "assets/file.obj"
#
# Per-object transforms (applied in SRT order: scale → rotate_y → translate):
#   scale     = 0.01       # uniform scale factor (e.g. cm → m)
#   rotate_y  = 90.0       # degrees around world Y axis
#   translate = [x, y, z]  # world-space offset applied last
#
# Materials:
#   lambertian          — color [r,g,b]
#   metal               — color [r,g,b]  fuzz
#   dielectric          — ior
#   spectral_dielectric — ior  dispersion
#   diffuse_light       — color [r,g,b]  (>1 = HDR bright)
#   pbr                 — albedo [r,g,b]  metallic  roughness
#   spectral_metal      — variant ("gold"|"copper"|"silver")  roughness
#   pearl               — film_thickness  film_scale  orient_strength

# ── Floor ─────────────────────────────────────────────────────────────────────
[[objects]]
shape    = { type = "infinite_plane", point = [0, 0, 0], normal = [0, 1, 0] }
material = { type = "pbr", albedo = [0.55, 0.50, 0.45], roughness = 0.85, metallic = 0.0 }

# ══════════════════════════════════════════════════════════════════════════════
# OLD CHAIR (OBJ mesh — modelled in cm, so scale 0.01 → metres)
# Placed outside the keeper's cottage, facing toward the lighthouse.
# ══════════════════════════════════════════════════════════════════════════════
[[objects]]
shape     = { type = "mesh", path = "assets/old_chair.obj" }
material  = { type = "spectral_metal", variant = "gold", roughness = 0.2 }
scale     = 0.01
rotate_y  = 160.0
translate = [3.8, 0.0, 2.2]

# ── Caustics ──────────────────────────────────────────────────────────────────
# Uncomment for caustic pools under the glass float and Fresnel lamp.
#
# [caustics]
# enabled       = true
# gather_radius = 0.12

# Gem benchmark scene for `rustracer --bench gem_bench.toml`: three heavy
# analytic gems clustered together so rays cross many facet planes —
# a 24-segment marquise (StepCut, ~570 planes), a princess with chevrons,
# and a 64-facet oval brilliant — in the studio staging with caustics on
# (500k photons, gather 0.008). Same env map / floor as the gem scenes.
name = "gem bench — marquise + princess + oval brilliant"

[camera]
look_from  = [0.030, 0.052, -0.062]
look_at    = [0.0, 0.020, 0.0]
vfov       = 30.0
aperture   = 0.0
focus_dist = 0.078
move_speed = 0.0028

[background]
type = "env_map"
path = "assets/studio_softbox.hdr"

[[objects]]
shape    = { type = "infinite_plane", point = [0, 0, 0], normal = [0, 1, 0] }
material = { type = "pbr", albedo = [0.04, 0.04, 0.05], roughness = 0.25, metallic = 0.0 }

[[gems]]
report          = "bench marquise"
measurements_mm = [9.00, 4.50, 3.00]
table_pct       = 58.0
crown_pct       = 14.0
pavilion_pct    = 44.0
cut             = "marquise"
material        = "emerald"
rotate_y        = 25.0
center          = [-0.020, 0.020, 0.004]
scale_mm        = 0.001

[[gems]]
report          = "bench princess (chevrons)"
measurements_mm = [4.50, 4.46, 3.14]
table_pct       = 72.0
crown_pct       = 10.0
pavilion_pct    = 58.0
cut             = "princess"
material        = "diamond"
center          = [0.020, 0.020, 0.006]
scale_mm        = 0.001

[[gems]]
report          = "bench oval brilliant (64 girdle facets, IGI LG625469749)"
measurements_mm = [8.99, 6.42, 3.97]
table_pct       = 58.0
crown_pct       = 16.0
pavilion_pct    = 41.0
girdle_facets   = 64
cut             = "brilliant"
material        = "diamond"
rotate_y        = -12.0
center          = [0.0, 0.020, -0.020]
scale_mm        = 0.001

[caustics]
enabled       = true
gather_radius = 0.008
num_photons   = 500000
